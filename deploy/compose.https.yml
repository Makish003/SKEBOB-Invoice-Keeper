# Только для сервера с доменом. Локальный запуск по README этот файл не использует.
# docker compose -f docker-compose.yml -f deploy/compose.https.yml up -d --build
services:
  web:
    # Наружу смотрит только Caddy.
    ports: !reset []

  worker:
    # DNS на VPS отдаёт для api.telegram.org адрес 149.154.166.110, до которого нет даже TCP (бот молчит).
    # Закрепляем рабочий адрес Telegram; другой — через TELEGRAM_API_IP в .env.
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env, например invoice-keeper.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
