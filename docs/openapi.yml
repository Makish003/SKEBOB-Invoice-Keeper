          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    cookieAuth:
      type: apiKey
      description: httpOnly-cookie сессии, ставится `POST /auth/login` (используется веб-панелью)
      in: cookie
      name: ik_session
    bearerAuth:
      type: http
      description: '`access_token` из ответа `POST /auth/login`'
      scheme: bearer
tags:
- name: Авторизация
  description: Вход, текущий пользователь, выход (завершение текущей сессии).
- name: Регулярные платежи
  description: Шаблоны повторяющихся расходов. Создание и прекращение — администратор.
- name: Периоды оплаты
  description: Конкретные периоды со своим сроком и отметкой оплаты. Отмечать могут все.
- name: Итоги
  description: Суммы по валютам отдельно, без конвертации.
- name: Пользователи
  description: Управление обычными пользователями — только администратор.
- name: Бюджет
  description: 'Бонус: плановые расходы на месяц и год по валютам; изменяет администратор.'
- name: Журнал
  description: 'Бонус: журнал входов и действий — только администратор.'
- name: Служебное
  description: Проверка работоспособности и параметры для интерфейса.
