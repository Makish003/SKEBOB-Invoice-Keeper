openapi: 3.1.0
info:
  title: Invoice Keeper API
  description: 'Напоминания о регулярных платежах: регулярные платежи, периоды, оплаты, итоги, пользователи.'
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Авторизация
      summary: Вход по логину и паролю
      description: 'Создаёт сессию: ставит httpOnly-cookie `ik_session` и возвращает `access_token` для Bearer. После 5 неудачных
        попыток за минуту с одного IP для логина — 429.'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Слишком много попыток входа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
      - Авторизация
      summary: Текущий пользователь
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/v1/auth/logout:
    post:
      tags:
      - Авторизация
      summary: Завершение текущей сессии
      description: 'Отзывает текущую сессию: её токен и cookie больше не действуют. Другие сессии пользователя остаются.'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/v1/recurring-payments:
    get:
      tags:
      - Регулярные платежи
      summary: Список регулярных платежей
      description: Активные платежи (по умолчанию) или вместе с прекращёнными. Доступно всем авторизованным.
      operationId: list_recurring_payments_api_v1_recurring_payments_get
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Включить прекращённые (удалённые) платежи
          default: false
          title: Include Deleted
        description: Включить прекращённые (удалённые) платежи
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPaymentList'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Регулярные платежи
      summary: Создание регулярного платежа
      description: Создаёт платёж и его периоды (все периоды с даты ближайшей оплаты, включая прошедшие). Если срок не дальше
        чем через REMINDER_DAYS_BEFORE дней, напоминание ставится в очередь сразу (FR-19) и уходит в течение нескольких секунд.
      operationId: create_recurring_payment_api_v1_recurring_payments_post
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringPaymentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPayment'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/recurring-payments/{payment_id}:
    get:
      tags:
      - Регулярные платежи
      summary: Регулярный платёж по id
      operationId: get_recurring_payment_api_v1_recurring_payments__payment_id__get
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: integer
          title: Payment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPayment'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Регулярные платежи
      summary: Прекращение регулярного платежа
      description: 'Мягкое удаление с сохранением истории: прошлые периоды и все оплаты остаются (видны с `include_deleted=true`),
        будущие неоплаченные периоды удаляются, открытые напоминания отменяются, новые периоды и напоминания не создаются.
        Повторное удаление → 404.'
      operationId: delete_recurring_payment_api_v1_recurring_payments__payment_id__delete
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: integer
          title: Payment Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences:
    get:
      tags:
      - Периоды оплаты
      summary: Список периодов (платежей)
      description: Все периоды, в т.ч. оплаченные и просроченные. Фильтры комбинируются через И. По умолчанию — только периоды
        активных платежей; история прекращённых — `include_deleted=true`.
      operationId: list_occurrences_api_v1_payment_occurrences_get
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OccurrenceStatus'
          - type: 'null'
          description: Статус оплаты
          title: Status
        description: Статус оплаты
      - name: overdue
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: true — только просроченные, false — без просрочки
          title: Overdue
        description: true — только просроченные, false — без просрочки
      - name: currency
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          title: Currency
      - name: recurring_payment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Recurring Payment Id
      - name: due_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок не раньше (включительно)
          title: Due From
        description: Срок не раньше (включительно)
      - name: due_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок не позже (включительно)
          title: Due To
        description: Срок не позже (включительно)
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Поиск по названию
          title: Q
        description: Поиск по названию
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Включить периоды прекращённых платежей (история)
          default: false
          title: Include Deleted
        description: Включить периоды прекращённых платежей (история)
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - due_date
          - -due_date
          - amount
          - -amount
          - name
          - -name
          type: string
          default: due_date
          title: Sort
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceList'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/payment-occurrences/{occurrence_id}:
    get:
      tags:
      - Периоды оплаты
      summary: Конкретный период
      operationId: get_occurrence_by_id_api_v1_payment_occurrences__occurrence_id__get
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: integer
          title: Occurrence Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occurrence'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Периоды оплаты
      summary: Подтверждение/отмена оплаты, исправление фактической даты
      description: Доступно всем авторизованным (FR-14). `status=paid` без `paid_at` → сегодня; `status=unpaid` очищает `paid_at`;
        `paid_at` без `status` — исправление даты оплаченного периода; дата в будущем → 422. Срок периода (`due_date`) не
        меняется, просрочка пересчитывается.
      operationId: patch_occurrence_api_v1_payment_occurrences__occurrence_id__patch
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: integer
          title: Occurrence Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrencePatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occurrence'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/payments/summary:
    get:
      tags:
      - Итоги
      summary: Итоговые суммы по валютам
      description: Суммы по периодам со сроком в интервале [due_from, due_to] (по умолчанию — текущий месяц), отдельно по
        RUB, USD, EUR, без конвертации. `as_of` — дата, на которую считаются оплачено/просрочено (по умолчанию сегодня).
      operationId: payments_summary_api_v1_payments_summary_get
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: due_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due From
      - name: due_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due To
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: As Of
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Учитывать периоды прекращённых платежей
          default: false
          title: Include Deleted
        description: Учитывать периоды прекращённых платежей
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users:
    get:
      tags:
      - Пользователи
      summary: Список пользователей
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    post:
      tags:
      - Пользователи
      summary: Создание обычного пользователя
      description: Всегда создаёт роль `user`. Администратор задаётся только в .env.
      operationId: create_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт (например, логин занят)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/v1/users/{user_id}:
    get:
      tags:
      - Пользователи
      summary: Пользователь по id
      operationId: get_user_api_v1_users__user_id__get
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Пользователи
      summary: Изменение пользователя
      description: Логин, имя, пароль обычного пользователя. Администратор из .env не изменяется → 403.
      operationId: update_user_api_v1_users__user_id__patch
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт (например, логин занят)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Пользователи
      summary: Удаление пользователя
      description: 'Мягкое удаление: сессии завершаются, отметки оплат в истории сохраняются. Администратор → 403.'
      operationId: delete_user_api_v1_users__user_id__delete
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Не выполнен вход или сессия истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/health:
    get:
      tags:
      - Служебное
      summary: Проверка работоспособности
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Currency:
      type: string
      enum:
      - RUB
      - USD
      - EUR
      title: Currency
    CurrencySummary:
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        total:
          type: string
          title: Total
          description: Сумма всех периодов со сроком в выбранном интервале
          examples:
          - '85000.00'
        paid:
          type: string
          title: Paid
          description: Оплачено на дату as_of
          examples:
          - '85000.00'
        unpaid:
          type: string
          title: Unpaid
          description: Не оплачено на дату as_of
          examples:
          - '85000.00'
        overdue:
          type: string
          title: Overdue
          description: Просрочено на дату as_of (срок прошёл, не оплачено)
          examples:
          - '85000.00'
        count_total:
          type: integer
          title: Count Total
        count_paid:
          type: integer
          title: Count Paid
        count_overdue:
          type: integer
          title: Count Overdue
