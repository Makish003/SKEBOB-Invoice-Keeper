      - status
      title: TicketPayment
      description: Период платежа, приложенный к заявке (снимок на момент чтения).
    TicketStatus:
      type: string
      enum:
      - open
      - in_progress
      - resolved
      title: TicketStatus
    TicketTopic:
      type: string
      enum:
      - question
      - bug
      - payment
      - access
      - other
      title: TicketTopic
    UserCreate:
      properties:
        login:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[A-Za-z0-9._-]+$
          title: Login
          description: Латиница, цифры, точка, дефис, подчёркивание; 3–64 символа
          examples:
          - ivan
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
          examples:
          - secret-pass
        display_name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
            examples:
            - Иван Петров
          - type: 'null'
          title: Display Name
          description: По умолчанию равно логину
        role:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
          description: Только `user`. Администратор задаётся в .env, `admin` → 403
      additionalProperties: false
      type: object
      required:
      - login
      - password
      title: UserCreate
    UserList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UserOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
      type: object
      required:
      - items
      - total
      title: UserList
    UserOut:
      properties:
        id:
          type: integer
          title: Id
        login:
          type: string
          title: Login
        display_name:
          type: string
          title: Display Name
        role:
          $ref: '#/components/schemas/Role'
        is_system:
          type: boolean
          title: Is System
          description: 'Администратор из .env: не изменяется и не удаляется через API'
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - login
      - display_name
      - role
      - is_system
      - created_at
      title: UserOut
    UserUpdate:
      properties:
        login:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 3
            pattern: ^[A-Za-z0-9._-]+$
            description: Латиница, цифры, точка, дефис, подчёркивание; 3–64 символа
            examples:
            - ivan
          - type: 'null'
          title: Login
        password:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 8
            examples:
            - secret-pass
          - type: 'null'
          title: Password
          description: Новый пароль; сессии пользователя завершаются
        display_name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
            examples:
            - Иван Петров
          - type: 'null'
          title: Display Name
        role:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
          description: Повысить до `admin` нельзя → 403
      additionalProperties: false
      type: object
      title: UserUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
